name: Build Devcontainers

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      container:
        description: "Optional comma-separated container names to build. Leave empty to build only changed containers."
        required: false
        default: ""

jobs:
  detect-changed-containers:
    runs-on: ubuntu-latest
    outputs:
      kubernetes: ${{ steps.paths-filter.outputs.kubernetes }}
      ansible-aap: ${{ steps.paths-filter.outputs.ansible-aap }}
      rhel-lab: ${{ steps.paths-filter.outputs.rhel-lab }}
      azure: ${{ steps.paths-filter.outputs.azure }}
      devops: ${{ steps.paths-filter.outputs.devops }}
      sre: ${{ steps.paths-filter.outputs.sre }}
      platform-engineering: ${{ steps.paths-filter.outputs.platform-engineering }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed container folders
        id: paths-filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            kubernetes: 'devcontainers/kubernetes/**'
            ansible-aap: 'devcontainers/ansible-aap/**'
            rhel-lab: 'devcontainers/rhel-lab/**'
            azure: 'devcontainers/azure/**'
            devops: 'devcontainers/devops/**'
            sre: 'devcontainers/sre/**'
            platform-engineering: 'devcontainers/platform-engineering/**'

  build:
    needs: detect-changed-containers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - container: kubernetes
            output-key: kubernetes
          - container: ansible-aap
            output-key: ansible-aap
          - container: rhel-lab
            output-key: rhel-lab
          - container: azure
            output-key: azure
          - container: devops
            output-key: devops
          - container: sre
            output-key: sre
          - container: platform-engineering
            output-key: platform-engineering

    permissions:
      contents: read
      packages: write

    if: |
      needs.detect-changed-containers.outputs[matrix.output-key] == 'true' ||
      github.event_name == 'workflow_dispatch' && (
        github.event.inputs.container == '' ||
        github.event.inputs.container == 'all' ||
        contains(github.event.inputs.container, matrix.container)
      )

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: ./devcontainers/${{ matrix.container }}
          file: ./devcontainers/${{ matrix.container }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/shanmeistro/simple-shell-${{ matrix.container }}:latest
            ghcr.io/shanmeistro/simple-shell-${{ matrix.container }}:v${{ github.run_number }}
            ghcr.io/shanmeistro/simple-shell-${{ matrix.container }}:${{ github.sha }}

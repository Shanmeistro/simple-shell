name: Build Devcontainers

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      container:
        description: "Optional comma-separated container names to build. Leave empty to build only changed containers."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - container: kubernetes
          - container: ansible-aap
          - container: rhel-lab
          - container: azure
          - container: devops
          - container: sre
          - container: platform-engineering

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          echo "IMAGE_VERSION=v$(cat VERSION)" >> "$GITHUB_ENV"

      - name: "ci: determine whether this container should build"
        id: should-build
        shell: bash
        run: |
          set -euo pipefail
          container="${{ matrix.container }}"
          build=false

          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            input="${{ github.event.inputs.container }}"
            if [[ -z "$input" || "$input" == 'all' ]]; then
              build=true
            else
              IFS=',' read -ra selected <<< "$input"
              for entry in "${selected[@]}"; do
                entry="${entry// /}"
                if [[ "$entry" == "$container" ]]; then
                  build=true
                  break
                fi
              done
            fi
          else
            build=true
          fi

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "selected=$container" >> "$GITHUB_OUTPUT"

      - name: "ci: show selection"
        run: |
          echo "container=${{ steps.should-build.outputs.selected }}"
          echo "should_build=${{ steps.should-build.outputs.build }}"

      - uses: docker/setup-buildx-action@v3
        if: steps.should-build.outputs.build == 'true'

      - uses: docker/login-action@v3
        if: steps.should-build.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        if: steps.should-build.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./devcontainers/${{ matrix.container }}
          file: ./devcontainers/${{ matrix.container }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/shanmeistro/simple-shell-${{ matrix.container }}:latest
            ghcr.io/shanmeistro/simple-shell-${{ matrix.container }}:${{ env.IMAGE_VERSION }}
            ghcr.io/shanmeistro/simple-shell-${{ matrix.container }}:v${{ github.run_number }}

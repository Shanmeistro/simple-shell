name: Build Devcontainers

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        container:
          - kubernetes
          - ansible-aap
          - rhel-lab
          - azure
          - devops
          - sre
          - platform-engineering

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./devcontainers/${{ matrix.container }}
          file: ./devcontainers/${{ matrix.container }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/shanmeistro/simple-shell-${{ matrix.container }}:latest
            ghcr.io/shanmeistro/simple-shell-${{ matrix.container }}:v${{ github.run_number }}
            ghcr.io/shanmeistro/simple-shell-${{ matrix.container }}:${{ github.sha }}